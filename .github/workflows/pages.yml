# Publishes the Bubbles Aro company website (built from the private Bubbles-site repo) at
# https://abhiramupadrashta.github.io/, plus redirects for old links and the Savora APK for old phones.
# SITE_KEY is a read-only deploy key for AbhiramUpadrashta/Bubbles-site.
name: Publish Bubbles Aro website
on:
  push:
    branches: [main]
  schedule:
    - cron: "37 * * * *"     # every hour: publish when the company site changes
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: AbhiramUpadrashta/Bubbles-site, ssh-key: "${{ secrets.SITE_KEY }}", path: src }
      - id: c
        run: |
          SHA="$(git -C src rev-parse HEAD)-$(git rev-parse HEAD)-$(curl -fsSL https://api.github.com/repos/AbhiramUpadrashta/Savora/releases/latest | python3 -c 'import sys,json;print(json.load(sys.stdin)["tag_name"])' || echo x)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          LIVE=$(curl -fsSL "https://abhiramupadrashta.github.io/build.txt?$(date +%s)" || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LIVE" = "$SHA" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build
        if: steps.c.outputs.changed == 'true'
        run: |
          (cd src && bash build.sh)
          mkdir _site && cp -R src/public/. _site/
          cp -R site/. _site/
          rm -f _site/_redirects
          curl -fL --retry 3 -o _site/Annakuber/Savora.apk https://github.com/AbhiramUpadrashta/Savora/releases/latest/download/Savora.apk || curl -fL --retry 3 -o _site/Annakuber/Savora.apk https://raw.githubusercontent.com/AbhiramUpadrashta/Savora/android/Savora.apk
          cp _site/Annakuber/Savora.apk _site/Annakuber/Annakuber.apk
          touch _site/.nojekyll
          echo -n "${{ steps.c.outputs.sha }}" > _site/build.txt
          find _site -maxdepth 2 | sort | head -60
      - if: steps.c.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
